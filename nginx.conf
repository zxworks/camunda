worker_processes  1;
 error_log  logs/error.log  info;
 events {
     worker_connections  1024;
 }
 http {
     include       mime.types;
     default_type  application/octet-stream;
     server {
         listen 8080;
         server_name localhost;
         location /delayed {
             content_by_lua_block {
                 -- 1. 从 URL 参数获取 delay 值，默认 3 秒
                 local delay = tonumber(ngx.var.arg_delay) or 3
                 -- 2. 安全限制：最小 0.1 秒，最大 10 秒（避免过大延迟影响服务）
                 delay = math.max(0.1, math.min(delay, 10))
                 -- 3. 非阻塞延迟
                 ngx.sleep(delay)
                 -- 4. 返回响应
                 ngx.status = 200
                 ngx.say(string.format("Delayed response after %.1f seconds!", delay))
                 ngx.exit(ngx.HTTP_OK)
             }
         }
     }
 }